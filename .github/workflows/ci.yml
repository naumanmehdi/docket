name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apprank_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/apprank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build core (mcp depends on its compiled output)
        run: npm run build --workspace @apprank/core
      - name: Test core (validation + data access vs Postgres)
        run: npm test --workspace @apprank/core
      - name: Build mcp server
        run: npm run build --workspace @apprank/mcp
      - name: Test mcp server (auth + tools + resources vs Postgres)
        run: npm test --workspace @apprank/mcp
      - name: Build web (Next.js landing page)
        run: npm run build --workspace @apprank/web
