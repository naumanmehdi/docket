<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>docket — register</title>
<style>
  :root {
    --paper: #fbf7ef;
    --ink: #26190f;
    --ember: #d9743f;
    --ember-deep: #bd5f2f;
    --mut: #6f5c42;
    --hair: rgba(38,25,15,0.08);
    --shadow: 0 1px 3px rgba(38,25,15,0.08), 0 6px 18px rgba(38,25,15,0.06);
    --radius: 12px;
    --radius-sm: 8px;
    --font: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--hair);
    background: rgba(251,247,239,0.85);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "DM Mono", monospace;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .mark {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--ink);
    color: var(--paper);
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 700;
  }
  .pill {
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .pill.ember { background: var(--ember); color: #fff6ec; }
  .pill.ghost { background: transparent; color: var(--ink); border: 1px solid var(--hair); }
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .lede {
    color: var(--mut);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
  }
  .field label {
    font-size: 11px;
    color: var(--mut);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .field input {
    padding: 10px 12px;
    border: 1px solid var(--hair);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
  }
  .field input:focus {
    outline: none;
    border-color: var(--ember);
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .btn {
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn.fire {
    background: var(--ember);
    color: #fff6ec;
    flex: 1;
  }
  .btn.fire:hover { background: var(--ember-deep); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--hair);
  }
  .notice {
    background: rgba(217,116,63,0.08);
    border: 1px solid rgba(217,116,63,0.2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12px;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .notice strong { color: var(--ember); }
  .result {
    margin-top: 16px;
    padding: 12px;
    background: rgba(38,25,15,0.03);
    border: 1px solid var(--hair);
    border-radius: var(--radius-sm);
    display: none;
  }
  .result.show { display: block; }
  .result-label {
    font-size: 11px;
    color: var(--mut);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .result code {
    font-family: var(--font);
    font-size: 12px;
    word-break: break-all;
    color: var(--ink);
  }
  .error {
    color: #8a2222;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">d</div>
    <div>docket</div>
  </div>
  <a class="pill ghost" href="/">← board</a>
</header>

<main>
  <div class="card">
    <h1>Get your MCP key</h1>
    <p class="lede">Enter your invite code and email to get a key. No account needed.</p>

    <div class="notice">
      <strong>Need a code?</strong> Ask someone who already has access, or request an invite.
    </div>

    <form id="reg-form">
      <div class="field">
        <label>Invite code</label>
        <input id="code" placeholder="DOCKET-ALPHA-1" required />
      </div>
      <div class="field">
        <label>Email or handle</label>
        <input id="owner" placeholder="you@example.com" required />
      </div>
      <div class="actions">
        <button type="submit" class="btn fire">Get my key</button>
        <button type="button" class="btn ghost" onclick="history.back()">Cancel</button>
      </div>
    </form>

    <div id="result" class="result">
      <div class="result-label">Your key (copy it now — shown once)</div>
      <code id="key-text"></code>
      <button class="btn fire" style="margin-top:10px;width:100%;" onclick="copyKey()">Copy key</button>
    </div>

    <div id="error" class="error"></div>
  </div>
</main>

<script>
  const form = document.getElementById('reg-form');
  const result = document.getElementById('result');
  const error = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.textContent = '';
    result.classList.remove('show');

    const res = await fetch('/api/mcp-keys/register', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        invite_code: document.getElementById('code').value.trim(),
        owner: document.getElementById('owner').value.trim(),
      }),
    });

    const data = await res.json();
    if (!res.ok) {
      error.textContent = data.error || 'Something went wrong. Try again.';
      return;
    }

    document.getElementById('key-text').textContent = data.key;
    result.classList.add('show');
  });

  function copyKey() {
    const text = document.getElementById('key-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('#result .btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy key', 1500);
    });
  }
</script>
</body>
</html>
